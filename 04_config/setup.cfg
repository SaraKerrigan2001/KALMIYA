[metadata]
name = kalmiya
version = 0.1.0
author = Maria
author_email = 
description = KALMIYA neural core assistant
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/maria/kalmiya
classifiers =
    Programming Language :: Python :: 3.13
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.13
install_requires =
    customtkinter>=5.2
    python-decouple
    opencv-python
    flask
    flask-cors
    requests
    httpx
    pydantic
    loguru

[options.entry_points]
console_scripts =
    kalmiya = kalmiya_launcher:main
