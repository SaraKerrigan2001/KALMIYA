version: '3.8'

services:
  kalmiya-api:
    build: .
    container_name: kalmiya_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: python api_server.py

  kalmiya-mcp:
    build: .
    container_name: kalmiya_mcp
    ports:
      - "8765:8765"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: python intelligence/kalmiya_mcp.py --http --puerto 8765
