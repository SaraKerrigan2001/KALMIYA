<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo holográfico -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a0dad;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ff6ec7;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#800080;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Base holográfica (elíptica como Cortana) -->
  <ellipse cx="100" cy="250" rx="60" ry="15" fill="rgba(106,13,173,0.3)" filter="url(#glow)"/>
  
  <!-- Cuerpo principal (forma fluida) -->
  <path d="M60,240 Q50,200 60,150 Q80,120 100,100 Q120,120 140,150 Q150,200 140,240 Z" 
        fill="url(#grad1)" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Cabeza/holograma superior -->
  <ellipse cx="100" cy="90" rx="35" ry="45" fill="url(#grad1)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- Ojos (luces azules/purple) -->
  <ellipse cx="90" cy="80" rx="8" ry="12" fill="#00ffff" filter="url(#glow)"/>
  <ellipse cx="110" cy="80" rx="8" ry="12" fill="#00ffff" filter="url(#glow)"/>
  
  <!-- Líneas de luz Laterales -->
  <path d="M65,150 Q50,150 60,180" stroke="#00ffff" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M135,150 Q150,150 140,180" stroke="#00ffff" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Anillos flotantes (como Cortana) -->
  <ellipse cx="100" cy="200" rx="50" ry="12" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.4" transform="rotate(-30 100 200)"/>
  <ellipse cx="100" cy="210" rx="45" ry="10" fill="none" stroke="#ff6ec7" stroke-width="2" opacity="0.5" transform="rotate(45 100 210)"/>
  <ellipse cx="100" cy="220" rx="40" ry="8" fill="none" stroke="#6a0dad" stroke-width="2" opacity="0.6" transform="rotate(-15 100 220)"/>
  
  <!-- Anillo superior -->
  <ellipse cx="100" cy="70" rx="40" ry="8" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.5" transform="rotate(20 100 70)"/>
  
  <!-- Efecto de brillo central -->
  <circle cx="100" cy="100" r="15" fill="rgba(255,105,180,0.3)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="25" fill="rgba(0,255,255,0.2)" filter="url(#glow)"/>
  
  <!-- Texto KALMIYA -->
  <text x="100" y="270" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.8">
    KALMIYA
  </text>
</svg>