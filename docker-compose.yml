services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=1234
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  kalmiya:
    build: .
    container_name: kalmiya_dashboard
    ports:
      - "8000:8000"  # Dashboard / API Server
      - "5900:5900"  # VNC Server (Opción 3 - GUI Virtual)
    volumes:
      # Mapear el directorio actual para persistir logs y skills
      - .:/app
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
    env_file:
      - 01_systems/KALMIYA_System/.env
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
