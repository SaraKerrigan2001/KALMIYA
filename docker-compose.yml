version: '3.8'

services:
  kalmiya:
    build: .
    container_name: kalmiya_dashboard
    ports:
      - "8000:8000"  # Dashboard / API Server
      - "5900:5900"  # VNC Server (Opción 3 - GUI Virtual)
    volumes:
      # Mapear el directorio actual para persistir la base de datos (kalmiya.db), logs y skills
      - .:/app
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8000
    env_file:
      - 01_systems/KALMIYA_System/.env
    restart: unless-stopped
